[General]
network = flora.simulations.LoRaNetworkTest
output-vector-file = ../results/n10-gw1-ADR-quick-s${runnumber}.ini.vec
**.maxTransmissionDuration = 4s
**.energyDetection = -110dBm

#cmdenv-autoflush = true
#cmdenv-status-frequency = 10000000s
#cmdenv-express-mode = false
#cmdenv-output-file = cmd_env_log.txt
**.vector-recording = false

rng-class = "cMersenneTwister"
**.loRaGW[0].numUdpApps = 1
**.loRaGW[0].packetForwarder.localPort = 2000
**.loRaGW[0].packetForwarder.destPort = 1000
**.loRaGW[0].packetForwarder.destAddresses = "networkServer"
**.loRaGW[0].packetForwarder.indexNumber = 0

**.networkServer.numApps = 1
**.networkServer.**.evaluateADRinServer = true
**.networkServer.app[0].typename = "NetworkServerApp"
**.networkServer.app[0].destAddresses = "loRaGW[0]"
**.networkServer.app[0].destPort = 2000
**.networkServer.app[0].localPort = 1000
**.networkServer.app[0].adrMethod = ${"avg"}

**.numberOfPacketsToSend = 0 # infinite packets for 5 minute simulation
sim-time-limit = 300s  # 5 minutes to match ns3 simulation
simtime-resolution = -11
repeat = 1

**.timeToFirstPacket = exponential(60s)  # 60 second intervals to match ns3
**.timeToNextPacket = exponential(60s)   # 60 second intervals to match ns3
**.alohaChannelModel = false

#nodes features
**.loRaNodes[*].**.initFromDisplayString = false
**.loRaNodes[*].**.evaluateADRinNode = true
**.loRaNodes[*].**initialLoRaBW = 125 kHz
**.loRaNodes[*].**initialLoRaCR = 4
**.loRaNodes[*].numApps = 1
**.loRaNodes[*].app[0].typename = "SimpleLoRaApp"

#gateway features
**.LoRaGWNic.radio.iAmGateway = true
**.loRaGW[*].**.initFromDisplayString = false

#power consumption features
**.loRaNodes[*].LoRaNic.radio.energyConsumer.typename = "LoRaEnergyConsumer"
**.loRaNodes[*].**.energySourceModule = "^.IdealEpEnergyStorage"
**.loRaNodes[*].LoRaNic.radio.energyConsumer.configFile = xmldoc("../energyConsumptionParameters.xml")

#general features - matching ns3 propagation model
**.sigma = 3.57  # Keeping existing value, close to ns3's random loss
**.constraintAreaMinX = 0m
**.constraintAreaMinY = 0m
**.constraintAreaMinZ = 0m
**.constraintAreaMaxZ = 0m

LoRaNetworkTest.**.radio.separateTransmissionParts = false
LoRaNetworkTest.**.radio.separateReceptionParts = false

**.ipv4Delayer.config = xmldoc("../cloudDelays.xml")
**.radio.radioMediumModule = "LoRaMedium"
**.LoRaMedium.pathLossType = "LoRaLogNormalShadowing"
**.minInterferenceTime = 0s
**.displayAddresses = false

# cache features
# **.LoRaMedium.mediumLimitCacheType = "LoRaMediumCache"
# **.LoRaMedium.rangeFilter = "communicationRange"
# **.LoRaMedium.neighborCacheType = "LoRaNeighborCache"
# **.LoRaMedium.neighborCache.range = 546m
# **.LoRaMedium.neighborCache.refillPeriod = 3000s

# Network topology - matching ns3 settings
**.numberOfNodes = 10  # Changed from 1000 to 10 to match ns3
**.numberOfGateways = 1
**.constraintAreaMaxX = 4000.0m  # 4000m x 4000m area to match ns3 (±2000m)
**.constraintAreaMaxY = 4000.0m
**.loRaGW[0].**.initialX = 2000.00m  # Center gateway at (2000, 2000)
**.loRaGW[0].**.initialY = 2000.00m

output-scalar-file = ../results/n10-gw1-ADR-quick-s${runnumber}.ini.sca

# Node positions - randomly distributed in 4000x4000m area
# Only defining 10 nodes to match ns3 simulation
**.loRaNodes[0].**.initialX = uniform(0m, 4000m)
**.loRaNodes[0].**.initialY = uniform(0m, 4000m)
**.loRaNodes[1].**.initialX = uniform(0m, 4000m)
**.loRaNodes[1].**.initialY = uniform(0m, 4000m)
**.loRaNodes[2].**.initialX = uniform(0m, 4000m)
**.loRaNodes[2].**.initialY = uniform(0m, 4000m)
**.loRaNodes[3].**.initialX = uniform(0m, 4000m)
**.loRaNodes[3].**.initialY = uniform(0m, 4000m)
**.loRaNodes[4].**.initialX = uniform(0m, 4000m)
**.loRaNodes[4].**.initialY = uniform(0m, 4000m)
**.loRaNodes[5].**.initialX = uniform(0m, 4000m)
**.loRaNodes[5].**.initialY = uniform(0m, 4000m)
**.loRaNodes[6].**.initialX = uniform(0m, 4000m)
**.loRaNodes[6].**.initialY = uniform(0m, 4000m)
**.loRaNodes[7].**.initialX = uniform(0m, 4000m)
**.loRaNodes[7].**.initialY = uniform(0m, 4000m)
**.loRaNodes[8].**.initialX = uniform(0m, 4000m)
**.loRaNodes[8].**.initialY = uniform(0m, 4000m)
**.loRaNodes[9].**.initialX = uniform(0m, 4000m)
**.loRaNodes[9].**.initialY = uniform(0m, 4000m)

# Initial LoRa settings for nodes - using default SF and TP distribution
**.loRaNodes[0].**initialLoRaSF = intuniform(7, 12)
**.loRaNodes[0].**initialLoRaTP = 14dBm
**.loRaNodes[1].**initialLoRaSF = intuniform(7, 12)
**.loRaNodes[1].**initialLoRaTP = 14dBm
**.loRaNodes[2].**initialLoRaSF = intuniform(7, 12)
**.loRaNodes[2].**initialLoRaTP = 14dBm
**.loRaNodes[3].**initialLoRaSF = intuniform(7, 12)
**.loRaNodes[3].**initialLoRaTP = 14dBm
**.loRaNodes[4].**initialLoRaSF = intuniform(7, 12)
**.loRaNodes[4].**initialLoRaTP = 14dBm
**.loRaNodes[5].**initialLoRaSF = intuniform(7, 12)
**.loRaNodes[5].**initialLoRaTP = 14dBm
**.loRaNodes[6].**initialLoRaSF = intuniform(7, 12)
**.loRaNodes[6].**initialLoRaTP = 14dBm
**.loRaNodes[7].**initialLoRaSF = intuniform(7, 12)
**.loRaNodes[7].**initialLoRaTP = 14dBm
**.loRaNodes[8].**initialLoRaSF = intuniform(7, 12)
**.loRaNodes[8].**initialLoRaTP = 14dBm
**.loRaNodes[9].**initialLoRaSF = intuniform(7, 12)
**.loRaNodes[9].**initialLoRaTP = 14dBm