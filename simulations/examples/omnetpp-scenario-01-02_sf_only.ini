[General]
network = flora.simulations.LoRaNetworkTest
sim-time-limit = 600min           # CORRECTED: 600 minutes to match ns-3 run script (not 10min!)
simtime-resolution = -11
repeat = 1

# Output
output-vector-file = ../results/scenario-01-baseline-02_sf_only-s${runnumber}.vec
output-scalar-file = ../results/scenario-01-baseline-02_sf_only-s${runnumber}.sca
**.vector-recording = true

# RNG
rng-class = "cMersenneTwister"

#================================================================================
# NETWORK TOPOLOGY & COUNTS
#================================================================================
**.numberOfNodes = 100
**.numberOfGateways = 1

# Area (constraint area adjusted to match CSV coordinate ranges)
**.constraintAreaMinX = -3000m                     # Covers negative X coordinates
**.constraintAreaMinY = -3000m                     # Covers negative Y coordinates  
**.constraintAreaMinZ = 0m                         # Ground level
**.constraintAreaMaxX = 3000m                      # Covers positive X coordinates
**.constraintAreaMaxY = 3000m                      # Covers positive Y coordinates
**.constraintAreaMaxZ = 20m                        # Covers gateway height (15m) + margin

# Mobility/placement flags
**.loRaNodes[*].**.initFromDisplayString = false
**.loRaGW[*].**.initFromDisplayString = false

#================================================================================
# PHY / CHANNEL CONFIGURATION
#================================================================================
**.radio.radioMediumModule = "LoRaMedium"
**.LoRaMedium.pathLossType = "LoRaLogNormalShadowing"
**.sigma = 3.57                     # shadowing sigma (kept from your example)
**.minInterferenceTime = 0s
**.alohaChannelModel = false
**.energyDetection = -110dBm
**.maxTransmissionDuration = 4s
LoRaNetworkTest.**.radio.separateTransmissionParts = false
LoRaNetworkTest.**.radio.separateReceptionParts = false

#================================================================================
# GATEWAY CONFIGURATION
#================================================================================
**.LoRaGWNic.radio.iAmGateway = true
**.loRaGW[*].numUdpApps = 1
**.loRaGW[0].packetForwarder.localPort = 2000
**.loRaGW[0].packetForwarder.destPort = 1000
**.loRaGW[0].packetForwarder.destAddresses = "networkServer"
**.loRaGW[0].packetForwarder.indexNumber = 0

#================================================================================
# NETWORK SERVER CONFIGURATION
#================================================================================
**.networkServer.numApps = 1
**.networkServer.app[0].typename = "NetworkServerApp"
**.networkServer.app[0].destAddresses = "loRaGW[0]"
**.networkServer.app[0].destPort = 2000
**.networkServer.app[0].localPort = 1000

#================================================================================
# SCENARIO CONFIGURATION TOGGLES - EDIT THESE VALUES DIRECTLY
#================================================================================
# Choose your configuration by commenting/uncommenting the sections below:
# OPTION A: Fixed radio parameters (baseline mode)
# OPTION B: Adaptive radio parameters (let OMNET++ decide)
# OPTION C: ADR enabled mode

#================================================================================
# NETWORK SERVER CONFIGURATION
#================================================================================
**.networkServer.numApps = 1
**.networkServer.app[0].typename = "NetworkServerApp"
**.networkServer.app[0].destAddresses = "loRaGW[0]"
**.networkServer.app[0].destPort = 2000
**.networkServer.app[0].localPort = 1000

# ADR Configuration - CHOOSE ONE:
# OPTION A & B: ADR Disabled (baseline)
**.networkServer.**.evaluateADRinServer = false
# OPTION C: ADR Enabled (uncomment line below, comment line above)
# **.networkServer.**.evaluateADRinServer = true

#================================================================================
# NODE RADIO CONFIGURATION - CHOOSE ONE OPTION
#================================================================================

# ===== OPTION A: FIXED RADIO PARAMETERS (BASELINE) =====
# Matches ns-3 baseline: SF10 fixed, 125 kHz, TP 14 dBm, CR 4/5, ADR disabled
# disabled by sub-scenario: **.loRaNodes[*].**initialLoRaSF = 10
**.loRaNodes[*].**initialLoRaBW = 125 kHz
**.loRaNodes[*].**initialLoRaCR = 4
# disabled by sub-scenario: **.loRaNodes[*].**initialLoRaTP = 14dBm
**.loRaNodes[*].**.evaluateADRinNode = false
# ===== OPTION B: ADAPTIVE RADIO PARAMETERS =====
# Uncomment these lines and comment OPTION A above to use adaptive/default settings
# **.loRaNodes[*].**initialLoRaSF = ""                  # Let OMNET++ choose
# **.loRaNodes[*].**initialLoRaBW = ""                  # Let OMNET++ choose  
# **.loRaNodes[*].**initialLoRaCR = ""                  # Let OMNET++ choose
# **.loRaNodes[*].**initialLoRaTP = ""                  # Let OMNET++ choose
# **.loRaNodes[*].**.evaluateADRinNode = false

# ===== OPTION C: ADR ENABLED =====
# Uncomment these lines and comment OPTION A above, also enable ADR in network server
# **.loRaNodes[*].**initialLoRaSF = 10                  # Starting SF (ADR will adjust)
# **.loRaNodes[*].**initialLoRaBW = 125 kHz             # Starting BW
# **.loRaNodes[*].**initialLoRaCR = 4                   # Starting CR
# **.loRaNodes[*].**initialLoRaTP = 14dBm               # Starting TP (ADR will adjust)
# **.loRaNodes[*].**.evaluateADRinNode = true

#================================================================================
# APPLICATION CONFIGURATION
#================================================================================
**.loRaNodes[*].numApps = 1
**.loRaNodes[*].app[0].typename = "SimpleLoRaApp"

# PACKET CONFIGURATION - CHOOSE ONE:

# ===== OPTION 1: BASELINE (MATCHES NS-3) =====
# Multiple packets per device over 600 minutes (~60 packets per device = 6000 total)
**.numberOfPacketsToSend = 0                      # infinite packets (matches ns-3 run script)
**.timeToFirstPacket = uniform(0s, 600s)          # spread first transmissions over first 10 minutes
**.timeToNextPacket = 600s                        # send every 10 minutes (matches ns-3)

# ===== OPTION 2: SINGLE PACKET TEST =====
# Uncomment these lines and comment OPTION 1 above for single packet testing
# **.numberOfPacketsToSend = 1                      # send once per node only
# **.timeToFirstPacket = uniform(0s, 600s)          # spread over first 10 minutes
# **.timeToNextPacket = 600s                        # irrelevant (only 1 packet)
# sim-time-limit = 10min                            # short simulation for single packet

#================================================================================
# OPTIONAL MODULES (ENERGY & DELAYS)
#================================================================================
# (Optional) delays & energy (uncomment if you use these files)
**.ipv4Delayer.config = xmldoc("../cloudDelays.xml")
**.loRaNodes[*].LoRaNic.radio.energyConsumer.typename = "LoRaEnergyConsumer"
**.loRaNodes[*].**.energySourceModule = "^.IdealEpEnergyStorage"
**.loRaNodes[*].LoRaNic.radio.energyConsumer.configFile = xmldoc("../energyConsumptionParameters.xml")

