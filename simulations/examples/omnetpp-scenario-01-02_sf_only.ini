#================================================================================
# USAGE EXAMPLES
#================================================================================
# 
# OPTION A (DEFAULT): Fixed Radio Parameters (matches ns-3 baseline)
# - Keep OPTION A uncommented
# - Comment out OPTION B and OPTION C
# - Result: SF10 fixed, 14dBm TP, no ADR
#
# OPTION B: Adaptive Radio Parameters  
# - Comment out OPTION A
# - Uncomment OPTION B
# - Result: OMNET++ chooses initial radio parameters
#
# OPTION C: ADR Enabled
# - Comment out OPTION A  
# - Uncomment OPTION C
# - Uncomment ADR server line: **.networkServer.**.evaluateADRinServer = true
# - Result: Adaptive Data Rate enabled
#
# This allows perfect comparison between ns-3 LoRaWAN and OMNET++ Flora
# using identical network topology and radio configurations.
#
# Appended by generator (initial SF)
**.loRaNodes[*].**initialLoRaSF = 10
