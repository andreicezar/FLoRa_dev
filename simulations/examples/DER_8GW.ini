[General]
network = flora.simulations.LoRaNetworkTest
output-vector-file = ../results/DER_8GW-s${runnumber}.ini.vec
output-scalar-file = ../results/DER_8GW-s${runnumber}.ini.sca
**.maxTransmissionDuration = 1d
**.vector-recording = true
**.scalar-recording = true


rng-class = "cMersenneTwister"
**.loRaGW[*].numUdpApps = 1
**.loRaGW[*].packetForwarder.localPort = 2000
**.loRaGW[*].packetForwarder.destPort = 1000 
**.loRaGW[*].packetForwarder.destAddresses = "networkServer"
**.loRaGW[*].packetForwarder.indexNumber = 0

**.networkServer.numApps = 1
**.networkServer.**.evaluateADRinServer = true
**.networkServer.app[0].typename = "NetworkServerApp"
**.networkServer.app[0].destAddresses = "loRaGW[0]"
**.networkServer.app[0].destPort = 2000
**.networkServer.app[0].localPort = 1000

**.numberOfPacketsToSend = 5000 #${numberOfPAckets = 200..5000 step 200} #100 #obviously 0 means infinite number of packets
sim-time-limit = 1d
simtime-resolution = -11
**.repeat = 50

**.timeToFirstPacket = exponential(600s) # Reduce initial delay
**.timeToNextPacket = exponential(600s) # Adjust transmission interval

**.alohaChannelModel = false

#nodes features
**.loRaNodes[*].**.initFromDisplayString = false
**.loRaNodes[*].**.evaluateADRinNode = true
**.loRaNodes[*].**initialLoRaBW = 125 kHz
**.loRaNodes[*].**initialLoRaCR = 4
**.loRaNodes[*].numApps = 1
**.loRaNodes[*].app[0].typename = "SimpleLoRaApp"

#gateway features
**.LoRaGWNic.radio.iAmGateway = true
**.loRaGW[*].**.initFromDisplayString = false

#power consumption features
**.loRaNodes[*].LoRaNic.radio.energyConsumer.typename = "LoRaEnergyConsumer"
**.loRaNodes[*].**.energySourceModule = "^.IdealEpEnergyStorage"
**.loRaNodes[*].LoRaNic.radio.energyConsumer.configFile = xmldoc("../energyConsumptionParameters.xml")

#general features
**.sigma = 3.57
**.constraintAreaMinX = 0m
**.constraintAreaMinY = 0m
**.constraintAreaMinZ = 0m
**.constraintAreaMaxZ = 0m

LoRaNetworkTest.**.radio.separateTransmissionParts = false
LoRaNetworkTest.**.radio.separateReceptionParts = false

**.ipv4Delayer.config = xmldoc("../cloudDelays.xml")
**.radio.radioMediumModule = "LoRaMedium"
**.minInterferenceTime = 0s
**.displayAddresses = false

# **.numberOfGateways = 8
**.constraintAreaMaxX = 5000.0m
**.constraintAreaMaxY = 5000.0m

**.numberOfGateways = 8
**.numberOfNodes = 1
**.simulationTimeLimit = 1h # Simulate for 1 hour

**.networkServer.app[0].adrMethod = ${"avg"}
**.LoRaMedium.pathLossType = "LoRaLogNormalShadowing"
**.energyDetection = -110dBm

**.loRaGW[0].LoRaNic.txPower = 14dBm

**.loRaGW[1].LoRaNic.txPower = 14dBm

**.loRaGW[2].LoRaNic.txPower = 14dBm

**.loRaGW[3].LoRaNic.txPower = 14dBm

**.loRaGW[4].LoRaNic.txPower = 14dBm

**.loRaGW[5].LoRaNic.txPower = 14dBm

**.loRaNodes[*].LoRaNic.spreadingFactor = 12#uniform(7,12)

**.loRaNodes[0].LoRaNic.txPower = 0..14

**.loRaNodes[0].LoRaNic.frequency = 868.1MHz, 868.3MHz, 868.5MHz
**.loRaNodes[0].LoRaNic.bandwidth = 125kHz
**.loRaNodes[0].LoRaNic.packetInterval = 144s  # 2.4 minutes

# LoRa Gateways (Modify X, Y based on paper positions or random placement)
**.loRaGW[0].mobility.initialX = 500m
**.loRaGW[0].mobility.initialY = 500m

**.loRaGW[1].mobility.initialX = 1200m
**.loRaGW[1].mobility.initialY = 600m

**.loRaGW[2].mobility.initialX = 800m
**.loRaGW[2].mobility.initialY = 1400m

**.loRaGW[3].mobility.initialX = 2000m
**.loRaGW[3].mobility.initialY = 1200m

**.loRaGW[4].mobility.initialX = 3000m
**.loRaGW[4].mobility.initialY = 2500m

**.loRaGW[5].mobility.initialX = 2500m
**.loRaGW[5].mobility.initialY = 1800m

**.loRaGW[6].mobility.initialX = 4000m
**.loRaGW[6].mobility.initialY = 3500m

**.loRaGW[7].mobility.initialX = 4500m
**.loRaGW[7].mobility.initialY = 4000m

# LoRa End Node Position
**.loRaNodes[0].mobility.initialX = 505m
**.loRaNodes[0].mobility.initialY = 495m
