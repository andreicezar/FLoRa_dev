#================================================================================
# SCENARIO 01 CONFIGURATION NOTES
#================================================================================
# Baseline Reference Case with configurable SF/TP initialization and ADR
#
# This baseline template will be processed by gen_omnet_scenarios.py to create
# multiple sub-scenario configurations with different parameter combinations.
#
# Key scenario 01 parameters:
# - Initial SF: 10 (DR2)
# - Initial TP: 14 dBm  
# - Packet interval: 600s (10 minutes)
# - Simulation time: 600 minutes
# - Path loss sigma: 3.57 dB
# - Devices: 100, Gateways: 1
# Appended by generator (sendInterval)
# **.app[*].sendInterval = 600s


# ==============================================================================
# EU868 Uplink Channel Plan (8 × 125 kHz)
# Apply to both end devices and gateways
# ==============================================================================

# --- End devices (LoRaNic.mac) ---
**.loRaNodes[*].LoRaNic.mac.numChannels = 8
**.loRaNodes[*].LoRaNic.mac.channelFrequencies = "868.1MHz 868.3MHz 868.5MHz 867.1MHz 867.3MHz 867.5MHz 867.7MHz 867.9MHz"
**.loRaNodes[*].LoRaNic.mac.channelBandwidths = "125kHz 125kHz 125kHz 125kHz 125kHz 125kHz 125kHz 125kHz"
# EU868 DR range for 125 kHz channels (DR0..DR5). If you want DR2 (SF10) only, set both to 2.
**.loRaNodes[*].LoRaNic.mac.channelMinDataRate = 0
**.loRaNodes[*].LoRaNic.mac.channelMaxDataRate = 5

# --- Gateways (LoRaGWNic.mac) ---
**.loRaGW[*].LoRaGWNic.mac.numChannels = 8
**.loRaGW[*].LoRaGWNic.mac.channelFrequencies = "868.1MHz 868.3MHz 868.5MHz 867.1MHz 867.3MHz 867.5MHz 867.7MHz 867.9MHz"
**.loRaGW[*].LoRaGWNic.mac.channelBandwidths = "125kHz 125kHz 125kHz 125kHz 125kHz 125kHz 125kHz 125kHz"
**.loRaGW[*].LoRaGWNic.mac.channelMinDataRate = 0
**.loRaGW[*].LoRaGWNic.mac.channelMaxDataRate = 5
