[General]
network = flora.simulations.LoRaNetworkTest
output-vector-file = ../../results_and_analysis/scenario_5/results_weighted_snr_conf/8GW-s-1ed_ADRopt_20B_Rayleigh.ini.vec
output-scalar-file = ../../results_and_analysis/scenario_5/results_weighted_snr_conf/8GW-s-1ed_ADRopt_20B_Rayleigh.ini.sca
record-eventlog = false
**.maxTransmissionDuration = 1600000s
**.vector-recording = true
**.scalar-recording = true
**.EV_INFO = true
*.networkServerApp.EV_INFO = true

# Try all of these (one at a time):
*.networkServer.debugADR = true
*.networkServer.app[0].debugADR = true  
**.debugADR = true
LoRaNetworkTest.networkServer.debugADR = true

**.verbosity = 4

# ADD these lines to your omnetpp.ini file:
*.networkServer.weightingAlpha = 0.7
*.networkServer.useWeightedSNR = true
*.networkServer.stableAlpha = 0.6
*.networkServer.unstableAlpha = 0.85
*.networkServer.useAdaptiveAlpha = true
*.networkServer.gwTimeoutSeconds = 300

**.loRaNodes[*].app[0].dataSize = 20B
**.networkServer.app[0].adrDeviceMargin = 15

rng-class = "cMersenneTwister"
**.loRaGW[*].numUdpApps = 1
**.loRaGW[*].packetForwarder.localPort = 2000
**.loRaGW[*].packetForwarder.destPort = 1000 
**.loRaGW[*].packetForwarder.destAddresses = "networkServer"
**.loRaGW[*].packetForwarder.indexNumber = 0

**.networkServer.numApps = 1
**.networkServer.**.evaluateADRinServer = true
**.networkServer.app[0].typename = "NetworkServerApp"
**.networkServer.app[0].destAddresses = "loRaGW[*]"
**.networkServer.app[0].destPort = 2000
**.networkServer.app[0].localPort = 1000

**.numberOfPacketsToSend = 5000 #${numberOfPAckets = 200..5000 step 200} #100 #obviously 0 means infinite number of packets
**.timeToFirstPacket = exponential(10s)
**.timeToNextPacket = exponential(250s)  # or fixed 250
sim-time-limit = 2500000s              # gives some buffer

simtime-resolution = -11
**.repeat = 5

**.alohaChannelModel = false

#nodes features
**.loRaNodes[*].**.initFromDisplayString = false
**.loRaNodes[*].**.evaluateADRinNode = true
**.loRaNodes[*].**initialLoRaBW = 125 kHz
**.loRaNodes[*].**initialLoRaCR = 4
**.loRaNodes[*].numApps = 1
**.loRaNodes[*].app[0].typename = "SimpleLoRaApp"

#gateway features
**.LoRaGWNic.radio.iAmGateway = true
**.loRaGW[*].**.initFromDisplayString = false

#power consumption features
**.loRaNodes[*].LoRaNic.radio.energyConsumer.typename = "LoRaEnergyConsumer"
**.loRaNodes[*].**.energySourceModule = "^.IdealEpEnergyStorage"
**.loRaNodes[*].LoRaNic.radio.energyConsumer.configFile = xmldoc("../../energyConsumptionParameters.xml")

#general features
**.sigma = 3.57
**.constraintAreaMinX = -20000m
**.constraintAreaMinY = -20000m
**.constraintAreaMinZ = 0m
**.constraintAreaMaxZ = 0m

LoRaNetworkTest.**.radio.separateTransmissionParts = false
LoRaNetworkTest.**.radio.separateReceptionParts = false

**.ipv4Delayer.config = xmldoc("../../cloudDelays.xml")
**.radio.radioMediumModule = "LoRaMedium"
**.minInterferenceTime = 0s
**.displayAddresses = false

**.constraintAreaMaxX = 20000m
**.constraintAreaMaxY = 20000m

**.numberOfGateways = 8
**.numberOfNodes = 1
**.simulationTimeLimit = 1600000s # Simulate for 1 hour

**.networkServer.app[0].adrMethod = ${"ADRopt"}
**.LoRaMedium.pathLossType = "RayleighFading"
*.radioMedium.pathLossType = "RayleighFading"
**.energyDetection = -110dBm

**.loRaNodes[*].radio.vector-recording = true

**.loRaNodes[*].**initialLoRaSF = 12
**.loRaNodes[*].**initialLoRaTP = 14dBm

# Gateway positions approximating paper's real Grenoble deployment
# Based on actual measured distances from experimental setup

**.loRaGW[0].mobility.initialX = 520m      # GW2: 0.52km (closest, high SNR)
**.loRaGW[0].mobility.initialY = 0m

**.loRaGW[1].mobility.initialX = 729m      # GW3: 1.03km (medium SNR)
**.loRaGW[1].mobility.initialY = 729m

**.loRaGW[2].mobility.initialX = 0m        # GW4: 1.34km (medium SNR)  
**.loRaGW[2].mobility.initialY = 1340m

**.loRaGW[3].mobility.initialX = -1019m    # GW5: 1.44km (high SNR)
**.loRaGW[3].mobility.initialY = 1019m

**.loRaGW[4].mobility.initialX = 1506m     # GW6: 2.13km (low SNR)
**.loRaGW[4].mobility.initialY = 1506m

**.loRaGW[5].mobility.initialX = -9779m    # GW8: 13.82km (distant, low SNR)
**.loRaGW[5].mobility.initialY = 9779m

**.loRaGW[6].mobility.initialX = 2828m     # GW7: ~4km (weak, excluded in paper)
**.loRaGW[6].mobility.initialY = 2828m

**.loRaGW[7].mobility.initialX = 1414m     # Additional position within 4km
**.loRaGW[7].mobility.initialY = -1414m

# LoRa End Device
**.loRaNodes[0].mobility.initialX = 0m
**.loRaNodes[0].mobility.initialY = 0m
