# ===================================================================
# LoRa ADR Quick Test - ALL OPTIMIZATIONS DISABLED (1000 packets, 10 min)
# ===================================================================

# ===================================================================
# 1. GENERAL SIMULATION PARAMETERS
# ===================================================================
[General]
network = flora.simulations.LoRaNetworkTest
sim-time-limit = 600000s                # 10 minutes (quick test)
simtime-resolution = -11
seed-set = 1                             # Same random seed as enabled version for comparison
rng-class = "cMersenneTwister"
**.repeat = 5

# ===================================================================
# 2. OUTPUT AND DEBUGGING SETTINGS
# ===================================================================
# Automatic filename generation with timestamp
result-dir = ../../results_and_analysis/scenario_5/results_quick_baseline_no_optimizations
output-vector-file = ${resultdir}_${inifile}.vec
output-scalar-file = ${resultdir}_${inifile}.sca
record-eventlog = false

# Debug and logging settings
**.vector-recording = true
**.scalar-recording = true
**.EV_INFO = true
*.networkServerApp.EV_INFO = true
**.verbosity = 4

# ADR-specific debugging
*.networkServer.app[0].debugADR = true
*.networkServer.app[0].debugLogFileName = "debug_adr_${inifile}.txt"

# ===================================================================
# 3. NETWORK TOPOLOGY CONFIGURATION
# ===================================================================

# Network size
**.numberOfGateways = 8
**.numberOfNodes = 5

# Gateway positions (Grenoble deployment approximation)
**.loRaGW[0].mobility.initialX = 520m       # GW2: 0.52km (closest, high SNR)
**.loRaGW[0].mobility.initialY = 0m

**.loRaGW[1].mobility.initialX = 729m       # GW3: 1.03km (medium SNR)
**.loRaGW[1].mobility.initialY = 729m

**.loRaGW[2].mobility.initialX = 0m         # GW4: 1.34km (medium SNR)  
**.loRaGW[2].mobility.initialY = 1340m

**.loRaGW[3].mobility.initialX = -1019m     # GW5: 1.44km (high SNR)
**.loRaGW[3].mobility.initialY = 1019m

**.loRaGW[4].mobility.initialX = 1506m      # GW6: 2.13km (low SNR)
**.loRaGW[4].mobility.initialY = 1506m

**.loRaGW[5].mobility.initialX = -9779m     # GW8: 13.82km (distant, low SNR)
**.loRaGW[5].mobility.initialY = 9779m

**.loRaGW[6].mobility.initialX = 2828m      # GW7: ~4km (weak, excluded in paper)
**.loRaGW[6].mobility.initialY = 2828m

**.loRaGW[7].mobility.initialX = 1414m      # Additional position within 4km
**.loRaGW[7].mobility.initialY = -1414m

# Node positions
**.loRaNodes[0].mobility.initialX = 0m      # Center node
**.loRaNodes[0].mobility.initialY = 0m

**.loRaNodes[1].mobility.initialX = 1000m   # East node  
**.loRaNodes[1].mobility.initialY = 0m

**.loRaNodes[2].mobility.initialX = 500m    # Northeast node (problematic in previous tests)
**.loRaNodes[2].mobility.initialY = 866m

**.loRaNodes[3].mobility.initialX = -500m   # Northwest node
**.loRaNodes[3].mobility.initialY = 866m

**.loRaNodes[4].mobility.initialX = -1000m  # West node (problematic in previous tests)
**.loRaNodes[4].mobility.initialY = 0m

# ===================================================================
# 4. NETWORK ARCHITECTURE AND COMMUNICATION
# ===================================================================

# Gateway network configuration
**.loRaGW[*].numUdpApps = 1
**.loRaGW[*].packetForwarder.localPort = 2000
**.loRaGW[*].packetForwarder.destPort = 1000 
**.loRaGW[*].packetForwarder.destAddresses = "networkServer"
**.loRaGW[*].packetForwarder.indexNumber = 0

# Network server configuration
**.networkServer.numApps = 1
**.networkServer.**.evaluateADRinServer = true
**.networkServer.app[0].typename = "NetworkServerApp"
**.networkServer.app[0].destAddresses = "loRaGW[*]"
**.networkServer.app[0].destPort = 2000
**.networkServer.app[0].localPort = 1000

# IP networking
**.ipv4Delayer.config = xmldoc("../../cloudDelays.xml")
**.displayAddresses = false

# ===================================================================
# 5. LORA PHYSICAL LAYER SETTINGS
# ===================================================================

# Radio medium and propagation
**.radio.radioMediumModule = "LoRaMedium"
**.LoRaMedium.pathLossType = "RayleighFading"
*.radioMedium.pathLossType = "RayleighFading"
**.energyDetection = -110dBm
**.sigma = 3.57

# Radio configuration
LoRaNetworkTest.**.radio.separateTransmissionParts = false
LoRaNetworkTest.**.radio.separateReceptionParts = false
**.minInterferenceTime = 0s
**.alohaChannelModel = false

# Initial LoRa parameters
**.loRaNodes[*].**initialLoRaSF = 12
**.loRaNodes[*].**initialLoRaTP = 14dBm
**.loRaNodes[*].**initialLoRaBW = 125 kHz
**.loRaNodes[*].**initialLoRaCR = 4

# Simulation area constraints
**.constraintAreaMinX = -20000m
**.constraintAreaMinY = -20000m
**.constraintAreaMinZ = 0m
**.constraintAreaMaxX = 20000m
**.constraintAreaMaxY = 20000m
**.constraintAreaMaxZ = 0m

# ===================================================================
# 6. NODE AND GATEWAY FEATURES
# ===================================================================

# Node configuration
**.loRaNodes[*].**.initFromDisplayString = false
**.loRaNodes[*].**.evaluateADRinNode = true
**.loRaNodes[*].numApps = 1
**.loRaNodes[*].app[0].typename = "SimpleLoRaApp"
**.loRaNodes[*].radio.vector-recording = true

# Gateway configuration
**.LoRaGWNic.radio.iAmGateway = true
**.loRaGW[*].**.initFromDisplayString = false

# ===================================================================
# 7. APPLICATION LAYER SETTINGS
# ===================================================================

# Traffic pattern (QUICK TEST - reduced scale)
**.numberOfPacketsToSend = 1000            # Quick test: 1000 packets per node
**.timeToFirstPacket = exponential(10s)    # Initial delay
**.timeToNextPacket = exponential(250s)    # Inter-packet interval
**.maxTransmissionDuration = 1600000s
**.simulationTimeLimit = 1600000s

# Payload configuration
**.loRaNodes[*].app[0].dataSize = 20B       # 20-byte payload

# ===================================================================
# 8. ADR ALGORITHM CONFIGURATION
# ===================================================================

# Basic ADR settings
**.networkServer.app[0].adrMethod = ${"ADRopt"}
**.networkServer.app[0].adrDeviceMargin = 15

# ===================================================================
# 9. ADR OPTIMIZATION FEATURES (ALL DISABLED - BASELINE TEST)
# ===================================================================

# 🚫 Weighted SNR Processing - DISABLED
*.networkServer.app[0].useWeightedSNR = false
*.networkServer.app[0].weightingAlpha = 0.7             # Default values (unused)
*.networkServer.app[0].stableAlpha = 0.6                # Default values (unused)
*.networkServer.app[0].unstableAlpha = 0.85             # Default values (unused)
*.networkServer.app[0].useAdaptiveAlpha = false         # DISABLED
*.networkServer.app[0].gwTimeoutSeconds = 300           # Unused

# 🚫 Dynamic Window Size Adaptation - DISABLED  
*.networkServer.app[0].useDynamicWindow = false         # DISABLED - uses baseWindowSize
*.networkServer.app[0].baseWindowSize = 20              # Fixed window size
*.networkServer.app[0].minWindowSize = 5                # Unused when disabled
*.networkServer.app[0].maxWindowSize = 40               # Unused when disabled
*.networkServer.app[0].stableVarianceThreshold = 1.0    # Unused when disabled
*.networkServer.app[0].unstableVarianceThreshold = 3.0  # Unused when disabled

# 🚫 Energy Bias for Robustness - DISABLED
*.networkServer.app[0].useWeightBias = false            # DISABLED - no energy penalty
*.networkServer.app[0].weightRobustnessBias = 0.1       # Default value (unused)

# 🚫 Congestion-Aware Network Optimization - DISABLED
*.networkServer.app[0].useCongestionAwareness = false
*.networkServer.app[0].maxSFLoad = 0.3                  # Unused
*.networkServer.app[0].collisionThreshold = 0.5         # Unused
*.networkServer.app[0].snrStabilityThreshold = 2.0      # Unused
*.networkServer.app[0].sfChangeDebounce = 300s          # Unused

# ===================================================================
# 10. ENERGY CONSUMPTION SETTINGS
# ===================================================================

# Power consumption model
**.loRaNodes[*].LoRaNic.radio.energyConsumer.typename = "LoRaEnergyConsumer"
**.loRaNodes[*].**.energySourceModule = "^.IdealEpEnergyStorage"
**.loRaNodes[*].LoRaNic.radio.energyConsumer.configFile = xmldoc("../../energyConsumptionParameters.xml")

# ===================================================================
# QUICK TEST BASELINE CONFIGURATION SUMMARY
# ===================================================================
# 🎯 Test Type: ALL ADR Optimizations DISABLED (Quick Baseline Test)
# 📊 Scale: 5 nodes, 8 gateways, 1000 packets/node, 10 minutes simulation
# 🚫 Features: Standard ADRopt only - no weighted SNR, no dynamic window, 
#             no energy bias, no congestion awareness
# 📈 Expected: Individual node optimization, higher collision rates,
#             more aggressive parameter selection (baseline comparison)
# 🐛 Debug: Basic ADR logging only for comparison
# ⚡ Purpose: Fast baseline establishment before running optimized version
# 
# 📋 VERIFICATION POINTS FOR BASELINE:
#    - No compilation errors
#    - No transmission duration exceeded errors
#    - ADR makes decisions every 20 packets (fixed window)
#    - Debug logs show basic ADR logic without optimization messages
#    - Nodes should eventually escape SF12 if algorithm works
#    - Establishes working baseline for optimization comparison
# ===================================================================